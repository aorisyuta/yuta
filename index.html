<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="ブラウザで動く電子工作 CAD: 回路図・SPICE シミュレーション・ユニバーサル基板パターン図・プリント基板設計とガーバー出力">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>UniBoard SPICE</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23D6C596'/%3E%3Cg fill='%238E8055'%3E%3Ccircle cx='9' cy='9' r='2'/%3E%3Ccircle cx='16' cy='9' r='2'/%3E%3Ccircle cx='23' cy='9' r='2'/%3E%3Ccircle cx='9' cy='16' r='2'/%3E%3Ccircle cx='16' cy='16' r='2'/%3E%3Ccircle cx='23' cy='16' r='2'/%3E%3Ccircle cx='9' cy='23' r='2'/%3E%3Ccircle cx='16' cy='23' r='2'/%3E%3Ccircle cx='23' cy='23' r='2'/%3E%3C/g%3E%3Cpath d='M9 23 L9 16 L16 9 L23 9' stroke='%23B4551C' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="js/md-pre.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/theme-new.css">
<link rel="stylesheet" href="css/theme-md.css">
<link rel="stylesheet" href="css/theme-pro.css">
<link rel="stylesheet" href="css/theme-pro-mobile.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand" title="UniBoard SPICE バージョン 2026.09.27"><svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" class="lg-bg"/><g class="lg-dot"><circle cx="8" cy="8" r="1.6"/><circle cx="14" cy="8" r="1.6"/><circle cx="20" cy="8" r="1.6"/><circle cx="8" cy="20" r="1.6"/><circle cx="20" cy="20" r="1.6"/></g><path class="lg-wave" d="M4 15h3.2l2.1-5.6 3.4 11.2 2.6-8 1.6 2.4H24"/></svg><b>UniBoard&nbsp;SPICE</b><span>v2026.09.27</span></div>
    <div class="tabs" role="tablist">
      <button id="tabSch" role="tab" aria-selected="true">回路図</button>
      <button id="tabPcb" role="tab" aria-selected="false">蛇の目基板</button>
      <button id="tabPcbx" role="tab" aria-selected="false">PCB</button>
    </div>
    <div class="sep"></div>

    <div class="tools" id="schTools">
      <div class="toolgroup">
      <button class="btn" id="tMarq" aria-pressed="false" title="なぞった範囲の部品をまとめて選択"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="11" height="9" rx="1" stroke-dasharray="2.6 2"/></svg><span>範囲選択</span></button>
      <button class="btn" id="tWire" aria-pressed="false" title="配線を引く"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h4.5V4h6.5"/><circle cx="2.5" cy="12.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="13.5" cy="4" r="1.4" fill="currentColor" stroke="none"/></svg><span>配線</span></button>
      <button class="btn" id="tJunc" aria-pressed="false" title="交差部の接続点を付け外し"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 2.2v11.6M2.2 8h11.6"/><circle cx="8" cy="8" r="2.5" fill="currentColor" stroke="none"/></svg><span>接続点</span></button>
      <button class="btn" id="tDel" aria-pressed="false" title="タップした部品・配線・接続点を削除"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M9.4 2.9 2.9 9.4a1.6 1.6 0 0 0 0 2.2l1.5 1.5a1.6 1.6 0 0 0 2.2 0l6.5-6.5a1.6 1.6 0 0 0 0-2.2l-1.5-1.5a1.6 1.6 0 0 0-2.2 0Z"/><path d="M5.6 13.5h7.9" stroke-linecap="round"/></svg><span>消しゴム</span></button>
      </div>
      <div class="toolgroup">
      <button class="btn" id="bAll" title="すべて選択"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.2 5.4V3.6a1.4 1.4 0 0 1 1.4-1.4h1.8M10.6 2.2h1.8a1.4 1.4 0 0 1 1.4 1.4v1.8M13.8 10.6v1.8a1.4 1.4 0 0 1-1.4 1.4h-1.8M5.4 13.8H3.6a1.4 1.4 0 0 1-1.4-1.4v-1.8"/><rect x="5.6" y="5.6" width="4.8" height="4.8" rx=".8"/></svg><span>全選択</span></button>
      <button class="btn" id="bTidy" title="配線を整える — 部品はそのまま、配線だけを短くまっすぐに引き直す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h7M2.5 8h11M2.5 12h5"/><path d="m11.2 10.6 1.4 1.4 2.2-2.6"/></svg><span>整える</span></button>
      <button class="btn" id="bLayout" title="自動レイアウト — 部品を並べ直し、電源記号を足のそばに置いて、配線も引き直す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="4.5" height="4" rx=".8"/><rect x="9.5" y="9.5" width="4.5" height="4" rx=".8"/><path d="M6.5 4.5h3.2a2 2 0 0 1 2 2v3"/><path d="m10.2 8 1.5 1.5L13.2 8"/></svg><span>自動レイアウト</span></button>
      <button class="btn icon" id="bUndo" title="元に戻す"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.2 7.4h7.2a3.4 3.4 0 0 1 0 6.8H8"/><path d="M6.2 4.4 3.2 7.4l3 3"/></svg></button>
      <button class="btn icon" id="bRedo" title="やり直し"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.8 7.4H5.6a3.4 3.4 0 0 0 0 6.8H8"/><path d="M9.8 4.4l3 3-3 3"/></svg></button>
      </div>
      <div class="toolgroup">
      <button class="btn" id="bPal2" title="部品リストの表示 / 非表示"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.4" y="2.4" width="4.7" height="4.7" rx="1.1"/><rect x="8.9" y="2.4" width="4.7" height="4.7" rx="1.1"/><rect x="2.4" y="8.9" width="4.7" height="4.7" rx="1.1"/><rect x="8.9" y="8.9" width="4.7" height="4.7" rx="1.1"/></svg><span>部品</span></button>
      <button class="btn" id="bSample" title="サンプル回路・新規作成"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.2 12.4V4.2a1.5 1.5 0 0 1 1.5-1.5h2.6l1.6 2.1h4.4a1.5 1.5 0 0 1 1.5 1.5v6.1a1.5 1.5 0 0 1-1.5 1.5H3.7a1.5 1.5 0 0 1-1.5-1.5Z"/></svg><span>サンプル</span></button>
      </div>
      <div class="toolgroup simgroup">
      <button class="btn" id="bSim" aria-pressed="false" title="シミュレーション (SPICE) パネル"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 8h2.4l1.6-4.6 2.6 9.2 1.8-6.4 1.1 1.8h2.9"/></svg><span>シミュレーション</span></button>
      <button class="btn" id="tProbe" aria-pressed="false" title="配線や部品をタップして波形を表示 (P)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 2.2l3.2 3.2-6.4 6.4-2.6.6.6-2.6z"/><path d="M4.8 11.2 2.2 13.8"/></svg><span>プローブ</span></button>
      <button class="btn icon" id="bRunQ" title="シミュレーション実行 (F5)"><svg viewBox="0 0 16 16"><path d="M4.5 3.2v9.6L12.8 8z" fill="currentColor"/></svg></button>
      </div>
    </div>

    <div class="tools" id="pcbTools" hidden>
      <button class="btn primary" id="bConvert" title="設定を選んで基板パターンを作る">基板に変換…</button>
      <button class="btn" id="bReseed" title="別の配置解を探す">再試行</button>
      <div class="sep"></div>
      <div class="tabs" role="tablist" id="viewTabs">
        <button id="vTop" role="tab" aria-selected="true">部品面</button>
        <button id="vBot" role="tab" aria-selected="false">半田面</button>
        <button id="vBoth" role="tab" aria-selected="false">両面</button>
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn cmdbtn" id="bCmd" title="コマンドと部品を検索 (Ctrl+K)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.4 3.4"/></svg><span>検索</span><kbd>Ctrl K</kbd></button>
    <button class="btn" id="bCalc" title="電子工作 計算ツール (T)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3" y="1.8" width="10" height="12.4" rx="1.6"/><path d="M5.4 4.6h5.2M5.6 8h.1M8 8h.1M10.4 8h.1M5.6 10.6h.1M8 10.6h.1M10.4 10.6h.1" stroke-linecap="round"/></svg><span>計算</span></button>
    <button class="btn" id="bImport" title="保存した回路図（.json）を開く"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v8"/><path d="M5 5.6 8 2.6l3 3"/><path d="M2.8 10.4v1.6a1.4 1.4 0 0 0 1.4 1.4h7.6a1.4 1.4 0 0 0 1.4-1.4v-1.6"/></svg><span>読み込み</span></button>
    <button class="btn dl" id="bExport" title="回路図・基板図・部品表などをダウンロード"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v8"/><path d="M5 7.6l3 3 3-3"/><path d="M2.8 10.4v1.6a1.4 1.4 0 0 0 1.4 1.4h7.6a1.4 1.4 0 0 0 1.4-1.4v-1.6"/></svg><span>ダウンロード</span></button>
    <button class="btn icon" id="bTheme" title="表示テーマ">◐</button>
    <button class="btn" id="bInsp"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.8"/><path d="M8 7.2v3.6"/><circle cx="8" cy="5.1" r=".95" fill="currentColor" stroke="none"/></svg><span>情報</span></button>
  </header>

  <main class="body">
    <div class="scrim" id="scrim" hidden></div>
    <aside class="palette" id="palette">
      <div class="phead"><b>部品</b><span class="pcount" id="libCount"></span><button class="pclose" id="palClose" aria-label="部品リストを閉じる">×</button></div>
      <div class="libsearch" id="libSearch"></div>
      <div class="pbody" id="paletteBody"></div>
    </aside>

    <section class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="hint" id="hint"></div>
      <button class="btn monotoggle" id="bMono" aria-pressed="false" hidden title="パターン図だけを白黒で表示（印刷向け）"><span class="mt-box"></span>白黒</button>
      <div class="zoombox">
        <button class="btn" id="zOut" title="縮小">−</button>
        <button class="btn" id="zFit" title="全体表示 (F)">全体</button>
        <button class="btn" id="zIn" title="拡大">＋</button>
      </div>
      <div class="actbar" id="actbar" hidden></div>
      <div id="progWrap" hidden>
        <div class="prog">
          <h4 id="progTitle">自動配置を計算中</h4>
          <p id="progText">焼きなまし法で部品位置を最適化しています</p>
          <div class="bar-track"><div class="bar-fill" id="progFill"></div></div>
        </div>
      </div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="itabs" role="tablist">
        <button id="iProp" role="tab" aria-selected="true">プロパティ</button>
        <button id="iNet"  role="tab" aria-selected="false">ネット</button>
        <button id="iWire" role="tab" aria-selected="false">配線指示</button>
        <button id="iChk"  role="tab" aria-selected="false">検証</button>
        <button class="pclose itab-close" id="inspClose" aria-label="情報パネルを閉じる">×</button>
      </div>
      <div class="ipane" id="paneProp"></div>
      <div class="ipane" id="paneNet" hidden></div>
      <div class="ipane" id="paneWire" hidden></div>
      <div class="ipane" id="paneChk" hidden></div>
    </aside>
  </main>

  <footer class="status" id="status"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet">
    <header><h3 id="modalTitle">出力</h3><button class="btn" id="modalClose">閉じる</button></header>
    <div class="content" id="modalBody"></div>
    <footer id="modalFoot"></footer>
  </div>
</div>

<script src="js/cad-core.js"></script>
<script src="js/cad-board.js"></script>
<script src="js/samples.js"></script>
<script src="js/cad-doc.js"></script>
<script src="js/sch-tidy.js"></script>
<script src="js/ui-pre.js"></script>
<script src="js/spice.js" data-worker></script>
<script src="js/spice-models.js" data-worker></script>
<script src="js/parts-symbols.js"></script>
<script src="js/parts-catalog.js"></script>
<script src="js/sim-netlist.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
<script src="js/simui.js"></script>
<script src="js/pcbx.js"></script>
<script src="js/perf-manual.js"></script>
<script src="js/calc.js"></script>
<script src="js/shell.js"></script>
<script src="js/perf-edit.js"></script>
<script src="js/md.js"></script>
<script src="js/pro.js"></script>
</body>
</html>
